[project]
name = "vindata-ingest"
version = "0.0.1"
description = "VinData Dagster ingest + scoring code-location."
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.9",
    "dagster-webserver>=1.9",
    "dagster-postgres>=0.25",
    "dagster-aws>=0.25",
    "boto3>=1.35",
    "polars>=1.18",
    "pyarrow>=18",
    "httpx>=0.28",
    "tenacity>=9",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "structlog>=24.4",
    "pydantic>=2.10",
    "pydantic-settings>=2.6",
    "agronomy",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vindata_ingest"]
