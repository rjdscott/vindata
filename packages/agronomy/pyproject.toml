[project]
name = "agronomy"
version = "0.1.0"
description = "Pure-Python viticultural agronomy models. No I/O, no globals, fully typed."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "VinData" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "hypothesis>=6.112",
    "mypy>=1.13",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agronomy"]
